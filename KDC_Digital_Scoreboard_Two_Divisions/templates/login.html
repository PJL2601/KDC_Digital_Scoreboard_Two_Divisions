{% extends "base.html" %}
{% block title %}Admin Login · KDC{% endblock %}
{% block content %}
<div class="auth-card"><div class="auth-icon">🏆</div><p class="eyebrow">EVENT CONTROL CENTRE</p><h1>Admin sign in</h1><p>Manage games, teams, host QR codes and results.</p>
<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username <input name="username" required autocomplete="username"></label>
<label>Password <input type="password" name="password" required autocomplete="current-password"></label>
<button class="button primary full">Sign in</button></form>
<a class="text-link" href="{{ url_for('setup') }}">First time here? Configure the admin →</a></div>
{% endblock %}
