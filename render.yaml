# ============================================================
# Render Blueprint for the KDC Digital Scoreboard
# ============================================================
# Deploys the SAME code twice as two independent web services,
# each with its own PostgreSQL database:
#
#   kdc-boys   (KDC_DIVISION=boys)   ->  kdc-boys-db
#   kdc-girls  (KDC_DIVISION=girls)  ->  kdc-girls-db
#
# Render creates everything in this file from one click when you
# connect the repo as a Blueprint. See RENDER_DEPLOY.md for steps.
#
# IMPORTANT: this file must live at the TOP LEVEL of the repo.
# The project code is nested two folders deep, so each web service
# below sets `rootDir` to that inner folder (where app.py lives).
# ------------------------------------------------------------

databases:
  - name: kdc-boys-db
    databaseName: kdc_boys
    plan: free
    # Internal connections (from the kdc-boys service) always work.
    # [] = no EXTERNAL access. To run the one-time data migration from
    # your laptop, temporarily allow your IP in the Render dashboard
    # (Database -> Access Control), then set it back to blocked.
    ipAllowList: []

  - name: kdc-girls-db
    databaseName: kdc_girls
    plan: free
    ipAllowList: []

services:
  # ---------------------- BOYS ----------------------
  - type: web
    name: kdc-boys
    runtime: python
    plan: free
    rootDir: KDC_Digital_Scoreboard_Two_Divisions/KDC_Digital_Scoreboard_Two_Divisions
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: KDC_DIVISION
        value: boys
      - key: BOYS_DATABASE_URL
        fromDatabase:
          name: kdc-boys-db
          property: connectionString
      - key: FLASK_SECRET_KEY        # Render generates a strong random value
        generateValue: true
      - key: ADMIN_SETUP_CODE        # only needed if you run /setup manually
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PUBLIC_BASE_URL         # UPDATE after first deploy to the real URL
        value: https://kdc-boys.onrender.com

  # ---------------------- GIRLS ----------------------
  - type: web
    name: kdc-girls
    runtime: python
    plan: free
    rootDir: KDC_Digital_Scoreboard_Two_Divisions/KDC_Digital_Scoreboard_Two_Divisions
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: KDC_DIVISION
        value: girls
      - key: GIRLS_DATABASE_URL
        fromDatabase:
          name: kdc-girls-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_SETUP_CODE
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PUBLIC_BASE_URL         # UPDATE after first deploy to the real URL
        value: https://kdc-girls.onrender.com
