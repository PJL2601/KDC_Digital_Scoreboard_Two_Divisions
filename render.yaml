# ============================================================
# Render Blueprint for the KDC Digital Scoreboard
# ============================================================
# Deploys the SAME code twice as two independent web services:
#
#   kdc-boys   (KDC_DIVISION=boys)
#   kdc-girls  (KDC_DIVISION=girls)
#
# Databases are NOT created by Render (its free tier allows only one).
# Each division uses a FREE external PostgreSQL database (Neon or
# Supabase). BOYS_DATABASE_URL / GIRLS_DATABASE_URL are marked
# `sync: false`, so Render prompts you to paste each connection string
# in the dashboard and they are never stored in git.
#
# IMPORTANT: this file must live at the TOP LEVEL of the repo.
# The project code is nested one folder deep, so each web service
# below sets `rootDir` to that inner folder (where app.py lives).
# See RENDER_DEPLOY.md for full steps.
# ------------------------------------------------------------

services:
  # ---------------------- BOYS ----------------------
  - type: web
    name: kdc-boys
    runtime: python
    plan: free
    rootDir: KDC_Digital_Scoreboard_Two_Divisions
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: KDC_DIVISION
        value: boys
      - key: BOYS_DATABASE_URL     # paste the BOYS external Postgres URL when prompted
        sync: false
      - key: FLASK_SECRET_KEY      # Render generates a strong random value
        generateValue: true
      - key: ADMIN_SETUP_CODE      # only needed if you ever run /setup manually
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PUBLIC_BASE_URL       # UPDATE after first deploy to the real URL
        value: https://kdc-boys.onrender.com

  # ---------------------- GIRLS ----------------------
  - type: web
    name: kdc-girls
    runtime: python
    plan: free
    rootDir: KDC_Digital_Scoreboard_Two_Divisions
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: KDC_DIVISION
        value: girls
      - key: GIRLS_DATABASE_URL    # paste the GIRLS external Postgres URL when prompted
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_SETUP_CODE
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PUBLIC_BASE_URL       # UPDATE after first deploy to the real URL
        value: https://kdc-girls.onrender.com
